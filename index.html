<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Priamus Flotta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b192c">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Priamus">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #0b192c;
  --orange: #ff7800;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1e293b;
  --light: #64748b;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
  margin: 0; padding: 16px 10px calc(24px + env(safe-area-inset-bottom));
  padding-top: calc(16px + env(safe-area-inset-top));
  -webkit-tap-highlight-color: transparent;
}
.card {
  max-width: 480px; margin: 0 auto; background: var(--card); padding: 26px 22px;
  border-radius: 16px; box-shadow: 0 10px 30px rgba(11,25,44,0.08); border-top: 6px solid var(--orange);
}
.logo { display: block; margin: 0 auto 10px; max-width: 160px; height: auto; }
.logo-sm { display: block; margin: 0 auto 6px; max-width: 100px; height: auto; }
h2, h3 { text-align: center; color: var(--blue); margin: 0 0 22px; font-weight: 700; }
h3 { font-size: 17px; }
p.sub { text-align: center; font-size: 14px; color: var(--light); margin: -14px 0 22px; }
.grp { margin-bottom: 16px; }
label { display: block; font-weight: 600; margin-bottom: 7px; font-size: 12px;
  text-transform: uppercase; letter-spacing: .5px; }
select, input {
  width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 16px; background: #f8fafc; font-family: inherit; color: var(--text);
}
select:focus, input:focus { border-color: var(--orange); outline: none; background: #fff;
  box-shadow: 0 0 0 3px rgba(255,120,0,.15); }
.btn {
  width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px;
  text-transform: uppercase; letter-spacing: .8px; font-family: inherit;
}
.btn:active { transform: scale(.99); }
.btn.orange { background: var(--orange); }
.btn.green { background: #10b981; }
.btn.blue { background: #0284c7; }
.btn.ghost { background: transparent; color: var(--light); border: 1px solid var(--border); }
.btn.danger { background: transparent; color: #ef4444; border: 1px solid #ef4444;
  padding: 9px; font-size: 12px; margin-top: 12px; }
.hidden { display: none !important; }
.viaggio {
  background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--blue);
  border-radius: 12px; padding: 18px; margin-bottom: 16px;
}
.viaggio.corso { border-left-color: var(--orange); }
.badge { display: inline-block; padding: 5px 9px; border-radius: 6px; font-size: 11px;
  font-weight: 700; text-transform: uppercase; float: right; }
.b-ass { background: #fff7ed; color: #ea580c; border: 1px solid #ffedd5; }
.b-cor { background: #f0f9ff; color: #0284c7; border: 1px solid #e0f2fe; }
.msg { margin-top: 16px; padding: 13px; border-radius: 8px; text-align: center;
  font-weight: 600; font-size: 14px; }
.tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 22px; }
.tab { flex: 1; padding: 12px; background: none; border: none; font-size: 14px;
  font-weight: 700; color: var(--light); border-bottom: 3px solid transparent;
  font-family: inherit; cursor: pointer; }
.tab.on { color: var(--orange); border-bottom-color: var(--orange); }
.preview { margin-top: 9px; padding: 11px; background: #f1f5f9; border-radius: 8px;
  border: 1px dashed #cbd5e1; font-size: 13px; font-weight: 600; line-height: 1.6; }
.nota { font-size: 13px; margin: 9px 0; padding: 10px; background: #fff7ed;
  border-left: 3px solid var(--orange); border-radius: 6px; color: #7c2d12; }
hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.hint { font-size: 12px; color: var(--light); margin-top: 5px; }
#offline { position: fixed; top: 0; left: 0; right: 0; background: #b91c1c; color: #fff;
  text-align: center; padding: 7px; font-size: 13px; font-weight: 600; z-index: 500; }
</style>
</head>
<body>

<div id="offline" class="hidden">⚠️ Nessuna connessione</div>

<!-- LOGIN -->
<div id="v-login" class="card">
  <img class="logo" src="icon-512.png" alt="Priamus">
  <h2>Portale Operativo</h2>
  <div class="grp">
    <label>Accedi come</label>
    <select id="tipo" onchange="cambiaTipo(); svegliaServer();">
      <option value="autista">Autista</option>
      <option value="responsabile">Responsabile (Admin)</option>
    </select>
  </div>
  <div class="grp" id="g-nome">
    <label>Seleziona il tuo nome</label>
    <select id="nome-autista" onfocus="svegliaServer()"><option>Caricamento…</option></select>
  </div>
  <div class="grp">
    <label id="lbl-pass">Il tuo PIN personale</label>
    <input type="password" id="pass" inputmode="numeric" placeholder="••••" onfocus="svegliaServer()">
  </div>
  <button class="btn" onclick="login()">Accedi</button>
  <div id="err-login" class="msg hidden" style="background:#fee2e2;color:#b91c1c;"></div>
</div>

<!-- ADMIN -->
<div id="v-admin" class="card hidden">
  <img class="logo-sm" src="icon-512.png" alt="Priamus">
  <h2>Area Admin</h2>
  <div class="tabs">
    <button class="tab on" id="t-ass" onclick="tab('ass')">📝 Assegna</button>
    <button class="tab" id="t-dash" onclick="tab('dash')">📊 Dashboard</button>
    <button class="tab" id="t-res" onclick="tab('res')">⛽ Resoconti</button>
  </div>

  <div id="p-ass">
    <div class="grp">
      <label>📅 Data dei viaggi</label>
      <input type="date" id="a-data">
      <div class="hint">Vale per tutti i viaggi che assegni adesso.</div>
    </div>
    <div class="grp"><label>Autista</label><select id="a-autista"></select></div>
    <div class="grp"><label>Camion (modello)</label><select id="a-mezzo" onchange="preview()"></select></div>
    <div class="grp"><label>Rimorchio</label><select id="a-rimorchio"></select></div>
    <div class="grp">
      <label>Tratta (viaggio chiave)</label>
      <select id="a-tratta" onchange="preview()"></select>
      <div id="a-preview" class="preview hidden"></div>
    </div>
    <div class="grp">
      <label>Nota per l'autista (facoltativa)</label>
      <input type="text" id="a-nota" placeholder="Es. chiamare all'arrivo…">
    </div>
    <button class="btn orange" onclick="assegna()">Conferma assegnazione</button>
    <button class="btn ghost" style="margin-top:8px;padding:9px;font-size:12px;" onclick="aggiornaDati()">🔄 Aggiorna autisti, camion e tratte</button>
    <div id="msg-admin" class="msg hidden"></div>
  </div>

  <div id="p-dash" class="hidden">
    <p class="sub">Situazione flotta in tempo reale</p>
    <button class="btn" style="padding:10px;font-size:13px;" onclick="caricaFlotta()">🔄 Aggiorna</button>
    <div id="msg-dash" class="msg hidden"></div>
    <div id="lista-flotta" style="margin-top:16px;"></div>
  </div>

  <div id="p-res" class="hidden">
    <div class="grp">
      <label>Mese</label>
      <select id="r-mese" onchange="caricaResoconti()"></select>
    </div>
    <div id="res-kpi"></div>
    <div id="res-lista"></div>
    <div id="res-dett"></div>
    <div id="res-msg" class="msg hidden"></div>
  </div>

  <button class="btn ghost" style="margin-top:26px;" onclick="esci()">Esci</button>
</div>

<!-- AUTISTA -->
<div id="v-autista" class="card hidden">
  <img class="logo-sm" src="icon-512.png" alt="Priamus">
  <h2>Benvenuto,<br><span id="nome-loggato" style="color:var(--orange)"></span></h2>

  <button class="btn blue" onclick="toggleRif(true)">⛽ Segnala rifornimento</button>
  <div id="form-rif" class="hidden" style="background:#f8fafc;padding:18px;border-radius:12px;border:1px solid #cbd5e1;margin-top:16px;">
    <h3 style="color:#0369a1">Nuovo rifornimento</h3>
    <div class="grp"><label>Camion</label><select id="r-mezzo"></select></div>
    <div class="grp"><label>Litri</label><input type="number" step="0.01" id="r-litri" inputmode="decimal"></div>
    <div class="grp"><label>Costo totale (€)</label><input type="number" step="0.01" id="r-costo" inputmode="decimal"></div>
    <div class="grp"><label>KM attuali</label><input type="number" id="r-km" inputmode="numeric"></div>
    <div class="grp"><label>Foto ricevuta</label><input type="file" id="r-foto" accept="image/*" capture="environment"></div>
    <button class="btn green" onclick="salvaRif()">Conferma</button>
    <button class="btn ghost" onclick="toggleRif(false)">Annulla</button>
  </div>

  <hr>
  <p class="sub">Le tratte a te assegnate</p>
  <div id="lista-viaggi"></div>
  <div id="msg-aut" class="msg hidden"></div>
  <button class="btn ghost" style="margin-top:26px;" onclick="esci()">Esci</button>
</div>

<script>
// ============================================================
//  CONFIGURAZIONE - i due valori da personalizzare
// ============================================================
const API_URL = "/.netlify/functions/api";
const SEGRETO = "priamus-flotta-2026-Kt7xQw9zLm";

// ============================================================
let DATI = { autisti: [], mezzi: [], rimorchi: [], regole: [], ultimeDestinazioni: {} };
let FLOTTA = [];
let VIAGGI = [];
let autistaLoggato = "";

// Tutte le azioni sono ora ripetibili in sicurezza:
// le scritture portano un id univoco e il server non le duplica.
function nuovoId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}

function attendi(ms) { return new Promise(r => setTimeout(r, ms)); }

async function chiamata(body, msTimeout) {
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), msTimeout || 25000);
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(body),   // text/plain: evita il preflight CORS
      signal: ctrl.signal
    });
    const testo = await res.text();
    let json;
    try {
      json = JSON.parse(testo);
    } catch (e) {
      // Apps Script a volte risponde con una pagina di errore: si riprova
      throw new Error("Il server non era pronto, riprovo…");
    }
    if (!json.ok) throw new Error(json.msg || "Errore sconosciuto");
    return json.dati;
  } finally {
    clearTimeout(stop);
  }
}

async function api(azione, extra) {
  const body = Object.assign({ azione: azione, segreto: SEGRETO }, extra || {});
  const tentativi = 3;

  let ultimo;
  for (let i = 0; i < tentativi; i++) {
    try {
      return await chiamata(body);
    } catch (e) {
      ultimo = e;
      // se il server risponde "PIN errato" o simili non ha senso insistere
      if (String(e.message || "").indexOf("errat") >= 0) throw e;
      if (i < tentativi - 1) await attendi(600 * (i + 1));
    }
  }
  throw ultimo;
}

// Sveglia il motore di Apps Script mentre l'utente digita il PIN
let svegliato = false;
function svegliaServer() {
  if (svegliato) return;
  svegliato = true;
  chiamata({ azione: "ping", segreto: SEGRETO }, 8000).catch(() => {});
}

function $(id) { return document.getElementById(id); }
function mostra(id) { $(id).classList.remove("hidden"); }
function nascondi(id) { $(id).classList.add("hidden"); }

function msg(id, testo, tipo) {
  const box = $(id);
  box.textContent = testo;
  box.className = "msg";
  const stili = {
    ok:    ["#dcfce7", "#15803d"],
    err:   ["#fee2e2", "#b91c1c"],
    info:  ["#e0f2fe", "#0369a1"],
    attesa:["#fef9c3", "#854d0e"]
  };
  const s = stili[tipo] || stili.info;
  box.style.background = s[0];
  box.style.color = s[1];
}

function popola(id, elenco) {
  const sel = $(id);
  sel.innerHTML = "";
  (elenco || []).forEach(x => {
    const o = document.createElement("option");
    if (typeof x === "string") { o.value = x; o.textContent = x; }
    else { o.value = x.targa; o.textContent = x.label; }
    sel.appendChild(o);
  });
}

// ---------- avvio ----------
function salvaCache(dati) {
  try { localStorage.setItem("priamus_elenchi", JSON.stringify(dati)); } catch (e) {}
}
function leggiCache() {
  try {
    const t = localStorage.getItem("priamus_elenchi");
    return t ? JSON.parse(t) : null;
  } catch (e) { return null; }
}

function riempiElenchi() {
  popola("nome-autista", DATI.autisti);
  popola("a-autista", DATI.autisti);
  popola("a-mezzo", DATI.mezzi);
  popola("a-rimorchio", DATI.rimorchi);
  popola("r-mezzo", DATI.mezzi);
  const sel = $("a-tratta");
  const scelta = sel.value;
  sel.innerHTML = '<option value="">-- Seleziona una tratta --</option>';
  (DATI.regole || []).forEach(r => {
    const o = document.createElement("option");
    o.value = r.chiave; o.textContent = r.chiave;
    sel.appendChild(o);
  });
  if (scelta) sel.value = scelta;
}

window.addEventListener("load", async () => {
  const oggi = new Date();
  $("a-data").value = oggi.getFullYear() + "-" +
    String(oggi.getMonth() + 1).padStart(2, "0") + "-" +
    String(oggi.getDate()).padStart(2, "0");

  aggiornaStatoRete();
  window.addEventListener("online", aggiornaStatoRete);
  window.addEventListener("offline", aggiornaStatoRete);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // 1) elenchi salvati in memoria del telefono: schermata pronta subito
  const cache = leggiCache();
  if (cache) { DATI = cache; riempiElenchi(); }

  // 2) aggiornamento dal server (sveglia anche il motore per il login)
  try {
    DATI = await api("elenchi");
    salvaCache(DATI);
    riempiElenchi();
  } catch (e) {
    if (!cache) {
      msg("err-login", "Errore di caricamento: " + e.message, "err");
      mostra("err-login");
    }
  }
});

function aggiornaStatoRete() {
  navigator.onLine ? nascondi("offline") : mostra("offline");
}

// ---------- login ----------
function cambiaTipo() {
  const admin = $("tipo").value === "responsabile";
  $("g-nome").classList.toggle("hidden", admin);
  $("lbl-pass").textContent = admin ? "Password di sistema" : "Il tuo PIN personale";
  $("pass").setAttribute("inputmode", admin ? "text" : "numeric");
}

async function login() {
  const pass = $("pass").value;
  if (!pass) { msg("err-login", "Inserisci la password/PIN!", "err"); mostra("err-login"); return; }
  msg("err-login", "Verifica credenziali…", "info"); mostra("err-login");
  try {
    const res = await api("login", {
      tipo: $("tipo").value,
      utente: $("nome-autista").value,
      password: pass
    });
    if (!res.success) { msg("err-login", res.msg, "err"); return; }
    nascondi("err-login");
    nascondi("v-login");
    if (res.role === "admin") {
      mostra("v-admin");
      // prepara la Dashboard in sottofondo: al tocco sara' gia' pronta
      api("statoFlotta").then(f => { FLOTTA = f; }).catch(() => {});
    } else {
      autistaLoggato = res.nome;
      $("nome-loggato").textContent = res.nome;
      mostra("v-autista");
      // I viaggi arrivano gia' con la risposta del login: nessuna attesa in piu'
      if (res.viaggi) mostraViaggi(res.viaggi);
      else caricaViaggi();
    }
  } catch (e) {
    msg("err-login", e.message, "err");
  }
}

function esci() {
  autistaLoggato = "";
  nascondi("v-admin"); nascondi("v-autista"); mostra("v-login");
  $("pass").value = "";
  nascondi("err-login"); nascondi("msg-admin"); nascondi("msg-aut");
  toggleRif(false);
  tab("ass");
  window.scrollTo(0, 0);
}

// ---------- admin ----------
function tab(quale) {
  ["ass", "dash", "res"].forEach(k => {
    $("t-" + k).classList.toggle("on", k === quale);
    $("p-" + k).classList.toggle("hidden", k !== quale);
  });
  if (quale === "dash") {
    if (FLOTTA && FLOTTA.length) disegnaFlotta(FLOTTA);   // subito il gia' scaricato
    caricaFlotta();                                       // poi aggiorna
  }
  if (quale === "res") caricaResoconti();
}

function preview() {
  const chiave = $("a-tratta").value;
  const box = $("a-preview");
  if (!chiave) { box.classList.add("hidden"); return; }
  const r = DATI.regole.find(x => x.chiave === chiave);
  if (!r) return;
  let partenza = r.partenza || DATI.ultimeDestinazioni[$("a-mezzo").value] ||
    "⚠️ Da definire (nessun viaggio precedente per questo mezzo)";
  box.innerHTML = "📍 <b>Partenza:</b> " + partenza + "<br>🏁 <b>Arrivo:</b> " + r.arrivo;
  box.classList.remove("hidden");
}

async function assegna() {
  const chiave = $("a-tratta").value;
  if (!chiave) { alert("Seleziona una tratta!"); return; }
  const data = $("a-data").value;
  if (!data) { alert("Inserisci la data dei viaggi!"); return; }

  const mezzo = $("a-mezzo").value;
  const r = DATI.regole.find(x => x.chiave === chiave);
  let partenza = r.partenza || DATI.ultimeDestinazioni[mezzo];
  if (!partenza) { alert("Partenza non determinabile: nessun viaggio precedente per questo mezzo!"); return; }

  const payload = {
    idViaggio: nuovoId(),
    autista: $("a-autista").value,
    targaMezzo: mezzo,
    targaRimorchio: $("a-rimorchio").value,
    partenza: partenza,
    arrivo: r.arrivo,
    chiave: chiave,
    nota: $("a-nota").value.trim(),
    dataViaggio: data
  };

  // PULIZIA IMMEDIATA: l'admin puo' gia' preparare l'assegnazione successiva
  DATI.ultimeDestinazioni[mezzo] = r.arrivo;
  $("a-tratta").value = "";
  $("a-nota").value = "";
  $("a-preview").classList.add("hidden");
  msg("msg-admin", "Invio di " + payload.autista + " → " + chiave + "…", "attesa");
  mostra("msg-admin");

  try {
    const res = await api("assegna", payload);
    msg("msg-admin", res.msg, "ok");
    setTimeout(() => nascondi("msg-admin"), 2500);
    // aggiorno la dashboard in sottofondo, senza far aspettare nessuno
    api("statoFlotta").then(f => { FLOTTA = f; }).catch(() => {});
  } catch (e) {
    msg("msg-admin", "NON salvato (" + payload.autista + " → " + chiave + "): " + e.message, "err");
  }
}

async function aggiornaDati() {
  msg("msg-admin", "Aggiornamento elenchi…", "attesa"); mostra("msg-admin");
  try {
    DATI = await api("aggiorna");
    salvaCache(DATI);
    riempiElenchi();
    msg("msg-admin", "Elenchi aggiornati.", "ok");
    setTimeout(() => nascondi("msg-admin"), 2500);
  } catch (e) { msg("msg-admin", e.message, "err"); }
}

async function caricaFlotta() {
  const box = $("lista-flotta");
  if (!FLOTTA || !FLOTTA.length) {
    box.innerHTML = "<p style='text-align:center;color:#64748b'>Caricamento…</p>";
  }
  try {
    FLOTTA = await api("statoFlotta");
    disegnaFlotta(FLOTTA);
  } catch (e) {
    box.innerHTML = "<p style='text-align:center;color:#b91c1c'>" + e.message + "</p>";
  }
}

function disegnaFlotta(flotta) {
  const box = $("lista-flotta");
  {
    if (!flotta.length) {
      box.innerHTML = "<div class='viaggio' style='text-align:center'>✅ Nessun mezzo in viaggio.</div>";
      return;
    }
    box.innerHTML = "";
    flotta.forEach(v => {
      const d = document.createElement("div");
      d.className = "viaggio" + (v.stato === "In Corso" ? " corso" : "");
      d.innerHTML =
        "<div><span class='badge " + (v.stato === "In Corso" ? "b-cor" : "b-ass") + "'>" + v.stato + "</span>" +
        "<strong style='font-size:15px;color:var(--blue);text-transform:uppercase'>" + v.autista + "</strong></div>" +
        "<div style='font-size:14px;margin-top:8px'><b>" + (v.chiave || (v.partenza + " ➔ " + v.arrivo)) + "</b></div>" +
        "<div style='font-size:12px;margin-top:8px;color:var(--light)'>🚚 " + v.mezzo + " | 🔗 " + v.rimorchio +
        "<br>📅 " + v.data + "</div>" +
        (v.nota ? "<div class='nota'>📌 " + v.nota + "</div>" : "") +
        // modulo di modifica, nascosto finche' non lo si apre
        "<div id='mod-" + v.id + "' class='hidden' style='margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)'>" +
          "<div class='grp'><label>Data</label><input type='date' id='m-data-" + v.id + "' value='" + (v.dataISO || "") + "'></div>" +
          "<div class='grp'><label>Autista</label><select id='m-aut-" + v.id + "'>" + opzioni(DATI.autisti, v.autista) + "</select></div>" +
          "<div class='grp'><label>Camion</label><select id='m-mez-" + v.id + "'>" + opzioni(DATI.mezzi, v.targaMezzo) + "</select></div>" +
          "<div class='grp'><label>Rimorchio</label><select id='m-rim-" + v.id + "'>" + opzioni(DATI.rimorchi, v.targaRimorchio) + "</select></div>" +
          "<div class='grp'><label>Tratta</label><select id='m-tra-" + v.id + "'>" + opzioniTratte(v.chiave) + "</select></div>" +
          "<div class='grp'><label>Nota per l'autista</label><input type='text' id='m-not-" + v.id + "' value=\"" + String(v.nota || "").replace(/"/g, "&quot;") + "\"></div>" +
          "<button class='btn orange' style='padding:11px;font-size:13px' onclick=\"salvaModifica('" + v.id + "')\">💾 Salva modifiche</button>" +
        "</div>";

      const bm = document.createElement("button");
      bm.className = "btn ghost";
      bm.style.cssText = "padding:9px;font-size:12px;margin-top:12px";
      bm.textContent = "✏️ Modifica viaggio";
      bm.onclick = () => {
        const f = $("mod-" + v.id);
        const aperto = !f.classList.contains("hidden");
        f.classList.toggle("hidden", aperto);
        bm.textContent = aperto ? "✏️ Modifica viaggio" : "✖️ Chiudi modifica";
      };
      d.appendChild(bm);

      const b = document.createElement("button");
      b.className = "btn danger";
      b.textContent = "🗑️ Elimina viaggio";
      b.onclick = () => elimina(v.id, v.autista);
      d.appendChild(b);
      box.appendChild(d);
    });
  }
}

// Costruisce le <option> di un elenco, con quella giusta gia' selezionata
function opzioni(elenco, scelto) {
  return (elenco || []).map(x => {
    const val = (typeof x === "string") ? x : x.targa;
    const lab = (typeof x === "string") ? x : x.label;
    return "<option value=\"" + String(val).replace(/"/g, "&quot;") + "\"" +
           (val === scelto ? " selected" : "") + ">" + lab + "</option>";
  }).join("");
}

function opzioniTratte(scelta) {
  return (DATI.regole || []).map(r =>
    "<option value=\"" + String(r.chiave).replace(/"/g, "&quot;") + "\"" +
    (r.chiave === scelta ? " selected" : "") + ">" + r.chiave + "</option>"
  ).join("");
}

// Salva le modifiche a un viaggio gia' assegnato o in corso
async function salvaModifica(id) {
  const v = FLOTTA.find(x => x.id === id);
  if (!v) return;

  const chiave = $("m-tra-" + id).value;
  const mezzo = $("m-mez-" + id).value;
  const regola = (DATI.regole || []).find(r => r.chiave === chiave);

  // se la tratta e' cambiata ricalcolo partenza e arrivo, altrimenti li lascio
  let partenza = v.partenza, arrivo = v.arrivo;
  if (regola && chiave !== v.chiave) {
    arrivo = regola.arrivo;
    partenza = regola.partenza || DATI.ultimeDestinazioni[mezzo] || v.partenza;
  }

  msg("msg-dash", "Salvataggio modifiche…", "attesa"); mostra("msg-dash");
  try {
    const res = await api("modifica", {
      id: id,
      dataViaggio: $("m-data-" + id).value,
      autista: $("m-aut-" + id).value,
      targaMezzo: mezzo,
      targaRimorchio: $("m-rim-" + id).value,
      chiave: chiave,
      partenza: partenza,
      arrivo: arrivo,
      nota: $("m-not-" + id).value.trim()
    });
    msg("msg-dash", res.msg, "ok");
    setTimeout(() => nascondi("msg-dash"), 2500);
    caricaFlotta();
  } catch (e) {
    msg("msg-dash", "Modifica NON salvata: " + e.message, "err");
  }
}

async function elimina(id, autista) {
  if (!confirm("Eliminare il viaggio di " + autista + "?\nL'operazione non si può annullare.")) return;
  try {
    await api("elimina", { id: id });
    FLOTTA = FLOTTA.filter(v => v.id !== id);   // sparisce subito
    disegnaFlotta(FLOTTA);
    api("statoFlotta").then(f => { FLOTTA = f; disegnaFlotta(FLOTTA); }).catch(() => {});
  } catch (e) {
    alert(e.message);
    caricaFlotta();
  }
}

             "<div class='hint'>Obbligatorio: senza i KM il viaggio non si chiude.</div></div>" +

             "<div class='grp'><label>Tonnellate</label><input type='number' step='0.01' inputmode='decimal' id='ton-" + v.id + "'></div>" +

// Il pulsante "Chiudi viaggio" resta spento finche' non ci sono i KM di arrivo
function controllaKm(id) {
  const campo = $("kma-" + id);
  const puls = $("btn-term-" + id);
  if (!campo || !puls) return;
  const ok = campo.value !== "" && !isNaN(Number(campo.value));
  puls.disabled = !ok;
  puls.style.opacity = ok ? "1" : "0.45";
  puls.style.cursor = ok ? "pointer" : "not-allowed";

async function avvia(id) {
  const km = $("kmp-" + id).value;
  if (!km) { alert("Inserisci i chilometri prima di partire!"); return; }

  // AGGIORNAMENTO IMMEDIATO: la card passa a "In Corso" senza aspettare il server
  const copia = VIAGGI.map(v => Object.assign({}, v));
  const v = VIAGGI.find(x => x.id === id);
  if (v) { v.stato = "In Corso"; mostraViaggi(VIAGGI); }
  msg("msg-aut", "Salvataggio in corso…", "attesa"); mostra("msg-aut");

  try {
    const res = await api("avvia", { id: id, kmPartenza: km, autista: autistaLoggato });
    if (res.viaggi) mostraViaggi(res.viaggi);
    nascondi("msg-aut");
  } catch (e) {
    mostraViaggi(copia);                       // torno indietro
    msg("msg-aut", "Non salvato: " + e.message, "err");
  }
}

// Comprime la foto PRIMA di spedirla: da ~5 MB a ~200 KB.
// E' l'intervento che accorcia di piu' l'attesa su "Chiudi viaggio".
// Legge TUTTE le foto scelte (il modulo del formulario ne accetta piu' di una)
function leggiFotoTutte(input) {
  const files = (input && input.files) ? Array.prototype.slice.call(input.files) : [];
  if (!files.length) return Promise.resolve([]);
  return files.reduce((catena, f) => catena.then(elenco =>
    leggiUnFile(f).then(x => { if (x) elenco.push(x); return elenco; })
  ), Promise.resolve([]));
}

function leggiFoto(input) {
  const f = input && input.files && input.files[0];
  return leggiUnFile(f);
}

function leggiUnFile(f) {
  return new Promise(resolve => {
    if (!f) { resolve(null); return; }

    const r = new FileReader();
    r.onerror = () => resolve(null);
    r.onload = e => {
      const img = new Image();
      img.onerror = () => resolve({ data: e.target.result, nome: f.name, mime: f.type });
      img.onload = () => {
        try {
          const MAX = 1400;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
            else { w = Math.round(w * MAX / h); h = MAX; }
          }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          const piccola = c.toDataURL("image/jpeg", 0.7);
          resolve({ data: piccola, nome: f.name.replace(/\.[^.]+$/, "") + ".jpg", mime: "image/jpeg" });
        } catch (err) {
          resolve({ data: e.target.result, nome: f.name, mime: f.type });
        }
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
}

async function termina(id) {
  const kmArr = $("kma-" + id).value;

  // I KM di arrivo sono OBBLIGATORI
  if (kmArr === "" || isNaN(Number(kmArr))) {
    alert("Inserisci i KM di arrivo prima di chiudere il viaggio.");
    return;
  }

  const ton = $("ton-" + id).value;
  const ore = $("ore-" + id).value;
  const nViaggi = $("nv-" + id) ? $("nv-" + id).value : "";
  const notaAut = $("nau-" + id) ? $("nau-" + id).value.trim() : "";
  const inputFoto = $("foto-" + id);

  msg("msg-aut", "Salvataggio in corso…", "attesa"); mostra("msg-aut");
  const copia = VIAGGI.map(x => Object.assign({}, x));

  mostraViaggi(VIAGGI.filter(x => x.id !== id));   // la card sparisce subito

  try {
    // 1) i DATI partono per primi
    await api("termina", {
      id: id,
      autista: autistaLoggato,
      kmArrivo: kmArr,
      tonnellate: ton,
      oreLavoro: ore,
      numeroViaggi: nViaggi,
      notaAutista: notaAut
    });
    msg("msg-aut", "Viaggio chiuso!", "ok");
    setTimeout(() => nascondi("msg-aut"), 2000);

    // 2) le FOTO viaggiano dopo, in sottofondo e una alla volta
    const foto = await leggiFotoTutte(inputFoto);
    if (foto.length) inviaFoto(id, foto);
  } catch (e) {
    mostraViaggi(copia);
    msg("msg-aut", "Non salvato: " + e.message, "err");
  }
}

// Manda le foto una dopo l'altra: in parallelo Google ne rifiuterebbe qualcuna
async function inviaFoto(id, foto) {
  let fatte = 0;
  msg("msg-aut", foto.length > 1 ? ("Invio foto 1 di " + foto.length + "…") : "Invio foto in corso…", "info");
  mostra("msg-aut");

  for (let i = 0; i < foto.length; i++) {
    try {
      await api("foto", {
        tipo: "viaggio", id: id,
        fotoData: foto[i].data,
        fotoNome: "Priamus_Doc_" + id + "_" + (i + 1) + "_" + foto[i].nome,
        fotoMime: foto[i].mime
      });
      fatte++;
      if (i + 1 < foto.length) msg("msg-aut", "Invio foto " + (i + 2) + " di " + foto.length + "…", "info");
    } catch (err) {
      msg("msg-aut", "Viaggio chiuso. Foto caricate: " + fatte + " di " + foto.length +
                     ". Errore: " + err.message, "err");
      return;
    }
  }
  msg("msg-aut", fatte > 1 ? (fatte + " foto salvate.") : "Foto salvata.", "ok");
  setTimeout(() => nascondi("msg-aut"), 2500);
}

let RES = null;
let RES_ORD = "km";
let RES_SCELTO = null;

function nFmt(v, d) {
  if (v == null || v === "") return "—";
  return Number(v).toLocaleString("it-IT", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
}

function nomeMese(m) {
  const nomi = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
                "luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const p = String(m).split("-");
  if (p.length !== 2) return m;
  return nomi[Number(p[1]) - 1] + " " + p[0];
}

async function caricaResoconti() {
  const sel = $("r-mese");
  const meseScelto = sel.value || null;
  $("res-kpi").innerHTML = "<p style='text-align:center;color:var(--light);padding:18px'>Caricamento…</p>";
  $("res-lista").innerHTML = "";
  $("res-dett").innerHTML = "";
  nascondi("res-msg");

  try {
    RES = await api("resoconti", { mese: meseScelto });

    // elenco mesi, solo la prima volta o se cambia
    if (sel.options.length !== RES.mesi.length) {
      sel.innerHTML = RES.mesi.map(m =>
        "<option value='" + m + "'" + (m === RES.mese ? " selected" : "") + ">" + nomeMese(m) + "</option>"
      ).join("");
    }
    sel.value = RES.mese;

    RES_SCELTO = null;
    disegnaResoconti();
  } catch (e) {
    $("res-kpi").innerHTML = "";
    msg("res-msg", e.message, "err"); mostra("res-msg");
  }
}

function disegnaResoconti() {
  if (!RES) return;
  const t = RES.totali;

  $("res-kpi").innerHTML =
    "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px'>" +
    [["Spesa gasolio", t.spesa ? nFmt(t.spesa, 0) + " €" : "—"],
     ["Litri", t.litri ? nFmt(t.litri, 0) : "—"],
     ["Km percorsi", nFmt(t.km, 0)],
     ["Consumo medio", t.consumo != null ? nFmt(t.consumo, 1) + " L" : "—"],
     ["Costo al km", t.euroKm != null ? nFmt(t.euroKm, 2) + " €" : "—"],
     ["Viaggi", nFmt(t.viaggi, 0)]]
    .map(x =>
      "<div style='background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px'>" +
      "<div style='font-size:11px;color:var(--light);text-transform:uppercase;letter-spacing:.4px'>" + x[0] + "</div>" +
      "<div style='font-size:19px;font-weight:700;color:var(--blue);margin-top:3px'>" + x[1] + "</div></div>"
    ).join("") + "</div>";

  const camion = RES.camion.slice().sort((a, b) => {
    if (RES_ORD === "consumo") return (b.consumo || 0) - (a.consumo || 0);
    return (b[RES_ORD] || 0) - (a[RES_ORD] || 0);
  });

  if (!camion.length) {
    $("res-lista").innerHTML = "<div class='viaggio' style='text-align:center;color:var(--light)'>Nessun dato per questo mese.</div>";
    $("res-dett").innerHTML = "";
    return;
  }

  const media = RES.totali.consumo;
  const maxC = Math.max.apply(null, camion.map(c => c.consumo || 0)) || 1;
  const senzaRif = camion.filter(c => c.km > 0 && !c.litri).length;

  let html =
    "<div style='display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap'>" +
    [["km", "Km"], ["consumo", "Consumo"], ["spesa", "Spesa"], ["viaggi", "Viaggi"]]
      .map(o => "<button class='btn " + (RES_ORD === o[0] ? "" : "ghost") + "' style='flex:1;min-width:74px;padding:8px;font-size:11px;margin-top:0' " +
                "onclick=\"RES_ORD='" + o[0] + "';disegnaResoconti()\">" + o[1] + "</button>").join("") +
    "</div>";

  html += camion.map(c => {
    const largh = c.consumo ? Math.max(6, c.consumo / maxC * 100) : 0;
    let col = "#94a3b8";
    if (c.consumo != null && media) {
      col = c.consumo > media * 1.05 ? "#dc2626" : (c.consumo < media * 0.95 ? "#10b981" : "#f59e0b");
    }
    const sel = RES_SCELTO === c.targa;
    return "<div onclick=\"RES_SCELTO='" + c.targa + "';disegnaResoconti()\" " +
      "style='display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:4px;" +
      "border:1px solid " + (sel ? "var(--orange)" : "transparent") + ";background:" + (sel ? "#fff7ed" : "transparent") + "'>" +
      "<div style='flex:1;min-width:0'>" +
        "<div style='font-size:13px;font-weight:600;color:var(--blue)'>" + c.nome + "</div>" +
        "<div style='font-size:11px;color:var(--light)'>" + c.targa + " · " + nFmt(c.km, 0) + " km · " + c.viaggi + " viaggi</div>" +
      "</div>" +
      "<div style='width:70px;height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden'>" +
        "<div style='width:" + largh + "%;height:100%;background:" + col + "'></div></div>" +
      "<div style='width:58px;text-align:right'>" +
        "<div style='font-size:13px;font-weight:700;color:" + col + "'>" + (c.consumo != null ? nFmt(c.consumo, 1) : "—") + "</div>" +
        "<div style='font-size:9px;color:var(--light)'>L/100km</div></div>" +
    "</div>";
  }).join("");

  if (senzaRif) {
    html += "<div class='nota' style='margin-top:10px'>⚠️ " + senzaRif +
            (senzaRif === 1 ? " camion ha" : " camion hanno") +
            " percorso km senza rifornimenti registrati: per loro il consumo non è calcolabile.</div>";
  }

  html += "<button class='btn' style='margin-top:14px' onclick='esportaResoconti()'>📊 Scarica in Excel</button>";
  $("res-lista").innerHTML = html;

  // dettaglio del camion selezionato
  const c = camion.find(x => x.targa === RES_SCELTO);
  if (!c) { $("res-dett").innerHTML = ""; return; }

  const scarto = (c.consumo != null && media) ? ((c.consumo - media) / media * 100) : null;
  const serie = (RES.andamento && RES.andamento[c.targa]) || [];
  const conDati = serie.filter(x => x.consumo != null);

  let dett = "<div style='background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:16px'>" +
    "<div style='font-size:15px;font-weight:700;color:var(--blue)'>" + c.nome + "</div>" +
    "<div style='font-size:11px;color:var(--light);margin-bottom:12px'>" + c.targa + "</div>" +
    "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:12px'>" +
    [["Km", nFmt(c.km, 0)], ["Viaggi", nFmt(c.viaggi, 0)], ["Rotazioni", nFmt(c.rotazioni, 0)],
     ["Tonnellate", nFmt(c.tonnellate, 1)], ["Ore", nFmt(c.ore, 1)],
     ["Litri", c.litri ? nFmt(c.litri, 1) : "—"],
     ["Spesa", c.spesa ? nFmt(c.spesa, 2) + " €" : "—"],
     ["€/km", c.euroKm != null ? nFmt(c.euroKm, 2) : "—"],
     ["vs media", scarto != null ? (scarto >= 0 ? "+" : "−") + nFmt(Math.abs(scarto), 1) + "%" : "—"]]
    .map(x => "<div><div style='font-size:11px;color:var(--light)'>" + x[0] + "</div>" +
              "<div style='font-size:15px;font-weight:700;color:var(--blue);margin-top:2px'>" + x[1] + "</div></div>").join("") +
    "</div>";

  if (conDati.length > 1) {
    const vals = conDati.map(x => x.consumo);
    const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    const scala = (mx - mn) || 1;
    dett += "<div style='margin-top:16px'>" +
      "<div style='font-size:11px;color:var(--light);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px'>Consumo mese per mese</div>" +
      "<div style='display:flex;align-items:flex-end;gap:6px;height:70px'>" +
      conDati.map(x => {
        const h = 20 + (x.consumo - mn) / scala * 50;
        return "<div style='flex:1;text-align:center'>" +
          "<div style='font-size:9px;color:var(--blue);font-weight:700;margin-bottom:2px'>" + nFmt(x.consumo, 1) + "</div>" +
          "<div style='height:" + h + "px;background:var(--blue);border-radius:3px 3px 0 0'></div>" +
          "<div style='font-size:9px;color:var(--light);margin-top:3px'>" + x.mese.split("-")[1] + "</div></div>";
      }).join("") + "</div></div>";
  }

  dett += "</div>";
  $("res-dett").innerHTML = dett;
}

// ---------- esportazione in Excel ----------
function caricaXLSX() {
  return new Promise((ris, rif) => {
    if (window.XLSX) { ris(); return; }
    const t = document.createElement("script");
    t.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    t.onload = () => ris();
    t.onerror = () => rif(new Error("Non riesco a caricare il modulo Excel (serve connessione)."));
    document.head.appendChild(t);
  });
}

async function esportaResoconti() {
  if (!RES) return;
  msg("res-msg", "Preparazione del file…", "attesa"); mostra("res-msg");
  try {
    await caricaXLSX();

    const righe = RES.camion.map(c => ({
      "Camion": c.nome, "Targa": c.targa, "Viaggi": c.viaggi, "Rotazioni": c.rotazioni,
      "Km percorsi": c.km, "Tonnellate": c.tonnellate, "Ore lavoro": c.ore,
      "Litri": c.litri || "", "Spesa (EUR)": c.spesa || "",
      "Consumo (L/100km)": c.consumo != null ? c.consumo : "",
      "Costo (EUR/km)": c.euroKm != null ? c.euroKm : ""
    }));
    const t = RES.totali;
    righe.push({
      "Camion": "TOTALE", "Targa": "", "Viaggi": t.viaggi, "Rotazioni": t.rotazioni,
      "Km percorsi": t.km, "Tonnellate": t.tonnellate, "Ore lavoro": t.ore,
      "Litri": t.litri || "", "Spesa (EUR)": t.spesa || "",
      "Consumo (L/100km)": t.consumo != null ? t.consumo : "",
      "Costo (EUR/km)": t.euroKm != null ? t.euroKm : ""
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(righe);
    ws["!cols"] = [{wch:20},{wch:11},{wch:8},{wch:10},{wch:12},{wch:11},{wch:11},{wch:10},{wch:12},{wch:16},{wch:13}];
    XLSX.utils.book_append_sheet(wb, ws, "Riepilogo camion");
    XLSX.writeFile(wb, "resoconti-" + RES.mese + ".xlsx");

    msg("res-msg", "File scaricato.", "ok");
    setTimeout(() => nascondi("res-msg"), 2500);
  } catch (e) {
    msg("res-msg", e.message, "err");
  }
}

// ---------- rifornimento ----------
function toggleRif(apri) {
  $("form-rif").classList.toggle("hidden", !apri);
}

async function salvaRif() {
  const mezzo = $("r-mezzo").value, litri = $("r-litri").value,
        costo = $("r-costo").value, km = $("r-km").value;
  if (!mezzo || !litri || !costo || !km) { alert("Compila tutti i dati!"); return; }
  const idRif = nuovoId();
  const inputFoto = $("r-foto");
  msg("msg-aut", "Salvataggio rifornimento…", "attesa"); mostra("msg-aut");
  toggleRif(false);

  try {
    await api("rifornimento", {
      idRifornimento: idRif,
      targaMezzo: mezzo, litri: litri, costo: costo, km: km
    });
    msg("msg-aut", "Rifornimento salvato!", "ok");

    const foto = await leggiFoto(inputFoto);
    ["r-litri", "r-costo", "r-km", "r-foto"].forEach(i => $(i).value = "");
    if (foto) {
      msg("msg-aut", "Invio ricevuta in corso…", "info");
      api("foto", {
        tipo: "rifornimento", id: idRif,
        fotoData: foto.data,
        fotoNome: "Ricevuta_" + mezzo + "_" + foto.nome,
        fotoMime: foto.mime
      }).then(() => {
        msg("msg-aut", "Ricevuta salvata.", "ok");
        setTimeout(() => nascondi("msg-aut"), 2500);
      }).catch(err => {
        msg("msg-aut", "Rifornimento salvato, ricevuta NON caricata: " + err.message, "err");
      });
    } else {
      setTimeout(() => nascondi("msg-aut"), 2500);
    }
  } catch (e) {
    toggleRif(true);
    msg("msg-aut", e.message, "err");
  }
}
</script>
